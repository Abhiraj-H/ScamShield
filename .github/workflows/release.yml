name: Validated release artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validated-release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      checks: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify protected main, release policy, and CI
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
          SCAMSHIELD_GITHUB_REPO: ${{ github.repository }}
        run: python scripts/verify-release.py
      - name: Recheck all security controls and build
        run: |
          npm ci --ignore-scripts
          npm ci --prefix backend --ignore-scripts
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: --require-hashes -r backend/requirements.lock
          .venv/bin/python -m pip install -r backend/requirements-dev.txt
          .venv/bin/python scripts/setup-security.py
          .venv/bin/python scripts/security_gate.py
          git archive --format=tar.gz --output=output/ScamShield-validated-source.tar.gz HEAD
          tar -czf output/ScamShield-web-build.tar.gz -C dist-demo .
      - name: Sign source, web build, and SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            output/ScamShield-validated-source.tar.gz
            output/ScamShield-web-build.tar.gz
            output/security/*-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-signed-release
          path: |
            output/ScamShield-validated-source.tar.gz
            output/ScamShield-web-build.tar.gz
            output/security/
# A cloud deployment step can consume only this validated, signed artifact after
# verifying its attestation. Cloud credentials and region are owner configuration.
