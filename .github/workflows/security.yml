name: Security and tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies and pinned scanners
        run: |
          npm ci --ignore-scripts
          npm ci --prefix backend --ignore-scripts
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: --require-hashes -r backend/requirements.lock
          .venv/bin/python -m pip install -r backend/requirements-dev.txt
          .venv/bin/python scripts/setup-security.py
      - name: Full gate
        run: .venv/bin/python scripts/security_gate.py
      - name: Preserve redacted scan reports and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence
          path: output/security/
          retention-days: 30
