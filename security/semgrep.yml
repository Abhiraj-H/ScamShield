rules:
  - id: no-dynamic-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic evaluation is forbidden in application code.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: no-shell-execution
    languages: [javascript, typescript]
    severity: ERROR
    message: Shell commands must not be built from application input.
    pattern-either:
      - pattern: exec(...)
      - pattern: execSync(...)
      - pattern: 'spawn(..., {shell: true, ...})'
  - id: no-raw-html
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not render untrusted scam evidence as HTML.
    pattern: <$TAG dangerouslySetInnerHTML={$VALUE} ... />
  - id: no-disabled-tls
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS verification must stay enabled.
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: 'new $CLASS({rejectUnauthorized: false, ...})'
  - id: no-localstorage-auth
    languages: [javascript, typescript]
    severity: ERROR
    message: Tokens and passwords must not be stored in localStorage.
    pattern-regex: 'localStorage\.setItem\(["\x27](token|password|access_token|refresh_token)["\x27]'
